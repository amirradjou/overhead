# The whole stack on one always-on machine (README: Where it runs): `docker compose up -d`, then open
# http://<this machine>:8090 on the TV. Settings come from .env (see .env.example): home, the window, the time zone.
# For development with the commands on the host, start only the broker: `docker compose up -d rabbitmq`.
name: overhead

# Shared by every overhead service: one image, the broker inside the compose network, one data volume (enrichment
# cache, history batches, heads-up ledger, facts).
x-overhead: &overhead
  image: overhead:local
  pull_policy: never # built by the poll service below
  env_file:
    - path: .env
      required: false
  environment:
    OVERHEAD_AMQP: amqp://overhead:overhead@rabbitmq:5672/
    OVERHEAD_DATA: /data
  volumes:
    - data:/data
  depends_on:
    rabbitmq:
      condition: service_healthy
  restart: unless-stopped
  mem_limit: 128m

services:
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    hostname: overhead-rabbitmq # RabbitMQ keys its data directory by node name, so keep it fixed
    environment:
      RABBITMQ_DEFAULT_USER: overhead
      RABBITMQ_DEFAULT_PASS: overhead
    ports:
      - "127.0.0.1:5673:5672" # AMQP
      - "127.0.0.1:15673:15672" # management UI: http://localhost:15673 (overhead / overhead)
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6
    restart: unless-stopped

  poll:
    <<: *overhead
    build: .
    pull_policy: build
    command: ["poll"]

  enrich:
    <<: *overhead
    command: ["enrich"]

  history:
    <<: *overhead
    command: ["history"]

  live:
    <<: *overhead
    command: ["live", "-web", "/web"]
    ports:
      # The TV reads it over the home network. It serves home's coordinates: keep it off the internet.
      - "8090:8090"

  headsup:
    <<: *overhead
    command: ["headsup"]

  facts:
    image: overhead-stats:local
    build: ./analysis
    env_file:
      - path: .env
        required: false
    environment:
      OVERHEAD_DATA: /data
    volumes:
      - data:/data
    restart: unless-stopped
    mem_limit: 384m

  # An S3-compatible server for the history writer's S3 store, only with `--profile s3`: rclone serves a directory
  # over the S3 API. Buckets are its top-level directories; overhead and overhead-test exist from the start.
  s3:
    profiles: ["s3"]
    image: rclone/rclone:1.69
    entrypoint: ["sh", "-c"]
    command:
      - mkdir -p /data/overhead /data/overhead-test &&
        exec rclone serve s3 /data --addr :9000 --auth-key overhead,overhead-s3-local
    ports:
      - "127.0.0.1:9010:9000"
    volumes:
      - s3:/data
    mem_limit: 256m

volumes:
  rabbitmq:
  s3:
  data:
